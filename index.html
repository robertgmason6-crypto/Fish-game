<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fish Tank Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>🐟 Fish Tank Simulator</h1>

  <div id="controls">
    <span id="fish-count">Fish: 0</span>
    <span id="money-display">💰 $500</span>
    <span id="no-money-msg" class="no-money hidden">Not enough money!</span>
  </div>

  <!-- Tank selector tabs -->
  <div id="tank-tabs">
    <button class="tank-tab active" aria-label="Switch to Tank 1: Guppies tank">🪣 Tank 1 (Guppies)</button>
    <button class="tank-tab" aria-label="Switch to Tank 2: Clownfish tank">🐠 Tank 2 (Clownfish)</button>
  </div>

  <div id="shop">
    <div class="shop-category">
      <span class="shop-title">🐟 Fish</span>
      <button id="add-fish-btn" class="shop-btn">Guppy ($100)</button>
      <button id="add-carnivore-btn" class="shop-btn shop-btn-red">Carnivore ($1000)</button>
    </div>
    <div class="shop-category">
      <span class="shop-title">🍖 Food</span>
      <button id="food-quality-btn" class="shop-btn">Better Food ($200) [0/2]</button>
      <button id="multi-food-btn" class="shop-btn">Food Slots ($200) [1/10]</button>
      <button id="auto-feeder-btn" class="shop-btn">Auto Feeder ($1000)</button>
    </div>
    <div class="shop-category">
      <span class="shop-title">🏆 Tank</span>
      <button id="tank-level-btn" class="shop-btn">Tank Level Up ($1000) [Lv.0]</button>
    </div>
    <div class="shop-category" id="tank2-shop">
      <span class="shop-title">🪸 Tank 2</span>
      <button id="add-coral-btn" class="shop-btn shop-btn-coral" style="display:none">Coral Rock ($500)</button>
      <button id="sell-tool-btn" class="shop-btn shop-btn-sell" style="display:none">🔧 Sell Tool</button>
    </div>
  </div>

  <div id="tank-wrapper">
    <canvas id="tank" width="800" height="500"></canvas>
  </div>

  <div id="legend">
    <div class="legend-item"><span class="legend-dot normal"></span> Healthy</div>
    <div class="legend-item"><span class="legend-dot hungry"></span> Hungry</div>
    <div class="legend-item"><span class="legend-dot dead"></span> Dead</div>
    <div class="legend-item"><span class="legend-dot food"></span> Food ($5)</div>
    <div class="legend-item"><span class="legend-dot coin"></span> Coin</div>
    <div class="legend-item"><span class="legend-dot diamond"></span> Diamond ($200)</div>
    <div class="legend-item"><span class="legend-dot guppy"></span> Guppy</div>
    <div class="legend-item"><span class="legend-dot medium-fish"></span> Medium</div>
    <div class="legend-item"><span class="legend-dot large-fish"></span> Large</div>
    <div class="legend-item"><span class="legend-dot king-fish"></span> 👑 King</div>
    <div class="legend-item"><span class="legend-dot carnivore-fish"></span> Carnivore</div>
    <div class="legend-item"><span class="legend-dot clown-male"></span> ♂ Clown</div>
    <div class="legend-item"><span class="legend-dot clown-female"></span> ♀ Clown</div>
  </div>

  <script src="game.js"></script>
</body>
</html>
